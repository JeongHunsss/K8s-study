apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: k8s-study
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8s-beginner-labs
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
