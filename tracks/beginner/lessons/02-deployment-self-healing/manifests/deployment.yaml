apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-study
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8s-beginner-labs
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: k8s-beginner-labs
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
